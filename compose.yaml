services:
  mysql:
    image: mysql:8.4
    container_name: sica-mysql
    restart: unless-stopped
    ports:
      - "${SICA_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: "${SICA_DB_NAME:-sica_db}"
      MYSQL_USER: "${SICA_DB_USER:-sica_app}"
      MYSQL_PASSWORD: "${SICA_DB_PASSWORD:?Defina SICA_DB_PASSWORD en el archivo .env}"
      MYSQL_ROOT_PASSWORD: "${SICA_DB_ROOT_PASSWORD:?Defina SICA_DB_ROOT_PASSWORD en el archivo .env}"
      TZ: America/Bogota
    volumes:
      - sica_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./database/migrations/002_usuarios_seguridad.sql:/docker-entrypoint-initdb.d/03-usuarios-seguridad.sql:ro
      - ./database/migrations/003_personas_empresas.sql:/docker-entrypoint-initdb.d/04-personas-empresas.sql:ro
      - ./database/migrations/004_control_visitas.sql:/docker-entrypoint-initdb.d/05-control-visitas.sql:ro
      - ./database/migrations/005_incidentes_auditoria.sql:/docker-entrypoint-initdb.d/06-incidentes-auditoria.sql:ro
      - ./database/migrations/006_reportes_dashboard.sql:/docker-entrypoint-initdb.d/07-reportes-dashboard.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sica_mysql_data:
    name: sica_mysql_data
